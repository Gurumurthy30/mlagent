[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mlagent"
dynamic = ["version"]
readme = "README.md"
description = "CLI multi-agent system that runs a machine learning project end to end with a local Ollama model."
requires-python = ">=3.11"
dependencies = [
    # Agent engine
    "langgraph>=1.2,<2",
    "langchain-ollama>=1.1,<2",
    "pydantic>=2.14,<3",
    "pyyaml>=6",
    "rich>=15",
    "psutil>=7",
    # Toolbox for the code the agents write
    "numpy>=2.0",
    "pandas>=2.2,<3",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "xgboost>=3.0",
    "catboost>=1.2",
    "optuna>=4",
    "joblib>=1.4",
    "matplotlib>=3.9",
    "pyarrow>=17",
    "statsmodels>=0.14",
    "pillow>=11",
]

[project.optional-dependencies]
# Deep learning for image, text and speech tasks. On Windows, install torch with the
# CUDA index first to get GPU support (see README).
deep = [
    "torch>=2.5",
    "torchvision",
    "torchaudio",
    "transformers>=4.50,<5",
    "sentence-transformers>=3",
    "timm>=1.0",
]
audio = ["librosa>=0.10", "soundfile>=0.12"]
vision = ["opencv-python-headless>=4.10"]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
mlagent = "mlagent.cli:main"

[tool.hatch.version]
path = "mlagent/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["mlagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
